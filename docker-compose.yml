services:
  db:
    image: postgres:16-alpine
    container_name: ums-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_management
    # Host port 5433 to avoid clashing with a native PostgreSQL that may already
    # occupy 5432 on the developer machine. Container still listens on 5432.
    ports:
      - '5433:5432'
    volumes:
      - ums_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ums_pgdata:
